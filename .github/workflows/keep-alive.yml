name: Keep the demo app awake

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Open the app (and wake it if it is asleep)
        run: python scripts/keep_alive.py
