[project]
name = "suraksha"
version = "0.1.0"
description = "Trade-finance duplicate financing detection on Snowflake"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
snowflake = ["snowflake-connector-python>=3.12", "snowflake-snowpark-python>=1.20"]
app = ["streamlit>=1.38", "pandas>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "e2e: end-to-end pipeline tests",
  "snowflake: requires a live Snowflake connection (skipped otherwise)",
]
